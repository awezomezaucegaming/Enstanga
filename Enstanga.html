road(0,13,130,3);road(0,15,3,8);road(0,31.5,3,19);

const plotM=[],houses=[];

  add(new THREE.BoxGeometry(4,.3,4),M(0x8a8f94),0,.3,0,g);

 const w=Math.sin(u.ph)*.75*Math.min(v,1.2),br=Math.sin(u.t*1.8)*.06,e=(o,x)=>o.rotation.x+=(x-o.rotation.x)*.35;

function math(){const o=$('tk');let q=0,ok=0;const ask=()=>{const a=Math.floor(Math.random()*12)+3,b=Math.floor(Math.random()*12)+3,op=Math.random()<.5?'+':'x',ans=op==='+'?a+b:a*b,set=new Set([ans]);while(set.size<4)set.add(ans+Math.floor(Math.random()*11)-5||ans+7);

async function buyL(id){const l=MK.find(x=>x.id===id);if(!l)return;const tot=l.price*l.qty;if(S.ens<tot){toast('Not enough Ens');return}

  S.ens-=tot;S.inv[l.item]=(S.inv[l.item]||0)+l.qty;toast('Bought '+l.qty+' '+NAME[l.item]);save();ui()}catch(e){toast('Trade failed')}}
